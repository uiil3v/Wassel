<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم رفض طلب التوثيق</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f9f7f3;
    font-family:Tahoma, Arial, sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;">
<tr>
<td align="center">

<table width="650" cellpadding="0" cellspacing="0" style="
    background:#ffffff;
    border-radius:20px;
    overflow:hidden;
    border:1px solid #e6ddd1;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
">

    <tr>
        <td style="height:8px;background:#dc3545;"></td>
    </tr>

    <tr>
        <td align="center" style="
            background:#4a3f35;
            padding:40px 30px;
        ">
            <div style="
                color:white;
                font-size:52px;
                font-weight:bold;
            ">
                وصْـــــل
            </div>

            <div style="
                margin-top:10px;
                color:#e8dfd1;
                font-size:14px;
            ">
                منصة النقل الجامعي الذكية
            </div>
        </td>
    </tr>

    <tr>
        <td style="
            padding:45px 40px;
            color:#4a3f35;
            line-height:2;
        ">

            <h2 style="margin-top:0;color:#dc3545;">
                تم رفض طلب التوثيق
            </h2>

            <p>
                مرحباً {{ user.full_name }}
            </p>

            <p style="color:#8c7b6b;">
                بعد مراجعة بياناتك ومستنداتك، تعذر اعتماد الحساب حالياً.
            </p>

            <div style="
                background:#fff5f5;
                border-right:5px solid #dc3545;
                padding:18px;
                margin:30px 0;
                border-radius:10px;
            ">
                <strong>سبب الرفض:</strong>
                <br><br>
                {{ reason }}
            </div>

            <p style="color:#8c7b6b;">
                يمكنك تعديل البيانات المطلوبة وإعادة إرسال طلب التوثيق من جديد.
            </p>

        </td>
    </tr>

    <tr>
        <td align="center" style="
            background:#fbfaf7;
            padding:25px;
            color:#8c7b6b;
            font-size:13px;
            border-top:1px solid #e6ddd1;
        ">
            فريق وصْـــــل
        </td>
    </tr>

</table>

</td>
</tr>
</table>

</body>
</html>
