{% extends "driver/base_driver.html" %}

{% block driver_content %}

<style>
    .form-card {
        background: white;
        border-radius: 35px;
        padding: 40px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.05);
        margin-bottom: 35px;
    }

    .form-card h5 {
        font-weight: 700;
        margin-bottom: 25px;
    }

    .premium-input {
        width: 100%;
        border-radius: 22px;
        padding: 14px 18px;
        border: 1.5px solid rgba(0, 0, 0, 0.08);
        background: #fdfcf9;
        transition: 0.3s ease;
    }

    .premium-input:focus {
        border-color: var(--accent-color);
        box-shadow: 0 10px 25px rgba(200, 169, 81, 0.2);
        outline: none;
    }
</style>

<div class="form-card">

    <h3 class="mb-4">إنشاء اشتراك جديد</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>الحي</label>
                <input type="text" name="neighborhood" class="premium-input" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>السعر (ر.س)</label>
                <input type="number" step="0.01" name="price" class="premium-input" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>عدد المقاعد</label>
                <input type="number" name="seats" class="premium-input" required>
            </div>

            <div class="col-md-6 mb-3">
                <label>نوع الاشتراك</label>
                <select name="duration" class="premium-input">
                    <option value="monthly">شهري</option>
                    <option value="quarterly">فصلي</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>تاريخ البداية</label>
                <input type="date" name="start_date" class="premium-input" required>

                <small id="end-date-preview" style="display:none; color:#888;"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label>تاريخ النهاية</label>
                <input type="date" name="end_date" class="premium-input">
            </div>

            <div class="col-12 mb-4">
                <label>ملاحظات (اختياري)</label>
                <textarea name="notes" rows="3" class="premium-input"></textarea>
            </div>

        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-accent px-5 py-2">
                إنشاء الاشتراك
            </button>
        </div>

    </form>

</div>

<script>
const durationField = document.querySelector('[name="duration"]');
const startDateField = document.querySelector('[name="start_date"]');
const endDateField = document.querySelector('[name="end_date"]');
const previewText = document.getElementById("end-date-preview");

function updateEndDate() {

    const duration = durationField.value;
    const startDate = startDateField.value;

    // إذا ما فيه تاريخ
    if (!startDate) {
        previewText.style.display = "none";
        return;
    }

    let start = new Date(startDate);

    // 🟡 اشتراك شهري
    if (duration === "monthly") {

        start.setDate(start.getDate() + 30);

        let formattedDate = start.toLocaleDateString('en-GB', {
            day: 'numeric',
            month: 'numeric',
            year: 'numeric'
        });

        endDateField.value = start.toISOString().split('T')[0];
        endDateField.readOnly = true;
        endDateField.closest('.col-md-6').style.display = "none";

        // 🔥 عرض النص
        previewText.innerText = "* ينتهي الاشتراك في: " + formattedDate;
        previewText.style.display = "block";
    }

    // 🔵 اشتراك فصلي
    else if (duration === "quarterly") {

        start.setDate(start.getDate() + 90);

        endDateField.value = start.toISOString().split('T')[0];
        endDateField.readOnly = false;
        endDateField.closest('.col-md-6').style.display = "block";

        // 🔥 إخفاء النص
        previewText.style.display = "none";
    }
}

// تشغيل الأحداث
durationField.addEventListener("change", updateEndDate);
startDateField.addEventListener("change", updateEndDate);

// 🔥 تشغيل عند تحميل الصفحة
updateEndDate();
</script>


{% endblock %}
