{% extends "base.html" %}

{% block title %}
إعادة تعيين كلمة المرور - وصل
{% endblock %}

{% block extra_css %}
<style>

.reset-section {
    padding: 30px 0 100px;
}

.reset-wrapper {
    background: linear-gradient(135deg, #f6f2ea, #ece6db);
    border-radius: 60px;
    padding: 60px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.05);
}

.reset-card {
    background: white;
    border-radius: 35px;
    padding: 55px;
    border: 1px solid rgba(200,169,81,0.25);
    box-shadow: 0 25px 50px rgba(0,0,0,0.06);
}

.reset-title {
    font-size: 2.3rem;
    font-weight: 700;
    margin-bottom: 12px;
}

.reset-subtitle {
    color: var(--soft-color);
    margin-bottom: 40px;
    line-height: 2;
}

.premium-input {
    width: 100%;
    border-radius: 22px;
    padding: 16px 20px;
    border: 1.5px solid rgba(0,0,0,0.08);
    background: #fdfcf9;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    outline: none;
}

.premium-input:hover {
    border-color: rgba(200,169,81,0.4);
}

.premium-input:focus {
    background: white;
    border-color: var(--accent-color);
    box-shadow: 0 15px 35px rgba(200,169,81,0.18);
    transform: translateY(-3px);
}

.btn-reset {
    background-color: var(--accent-color);
    color: white;
    border-radius: 35px;
    padding: 14px;
    border: none;
    transition: 0.3s ease;
    font-weight: 600;
}

.btn-reset:hover {
    background-color: #b8953f;
    transform: translateY(-4px);
}

.password-wrapper {
    position: relative;
}

.password-toggle {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: #888;
    font-size: 18px;

    cursor: pointer;

    transition: 0.3s ease;
}

.password-toggle:hover {
    color: var(--accent-color);
}

.errorlist {
    color: #dc3545;
    text-align: start;
    margin-top: 8px;
    font-size: 0.9rem;
}

@media (max-width:768px){

    .reset-wrapper{
        padding:25px;
        border-radius:30px;
    }

    .reset-card{
        padding:35px 20px;
    }

}

</style>
{% endblock %}

{% block content %}

<section class="reset-section">

    <div class="container">

        <div class="reset-wrapper">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="reset-card text-center">

                        <h2 class="reset-title">
                            تعيين كلمة مرور جديدة
                        </h2>

                        <p class="reset-subtitle">

                            أدخل كلمة المرور الجديدة الخاصة بحسابك.

                        </p>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="text-start mb-4">

                                <label class="mb-2">
                                    كلمة المرور الجديدة
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        name="new_password1"
                                        id="password1"
                                        class="premium-input pe-5"
                                        required
                                    >

                                    <button type="button"
                                            class="password-toggle"
                                            onclick="togglePassword('password1', this)">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="text-start mb-4">

                                <label class="mb-2">
                                    تأكيد كلمة المرور
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        name="new_password2"
                                        id="password2"
                                        class="premium-input pe-5"
                                        required
                                    >

                                    <button type="button"
                                            class="password-toggle"
                                            onclick="togglePassword('password2', this)">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            {{ form.errors }}

                            <button type="submit"
                                    class="btn btn-reset w-100">

                                حفظ كلمة المرور الجديدة

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    const type = input.getAttribute("type") === "password"
        ? "text"
        : "password";

    input.setAttribute("type", type);

    button.innerHTML = type === "password"
        ? '<i class="bi bi-eye"></i>'
        : '<i class="bi bi-eye-slash"></i>';
}

</script>

{% endblock %}
