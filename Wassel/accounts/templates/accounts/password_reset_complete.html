{% extends "base.html" %}

{% block title %}
تم تغيير كلمة المرور - وصل
{% endblock %}

{% block extra_css %}
<style>

.complete-section {
    padding: 30px 0 100px;
}

.complete-wrapper {
    background: linear-gradient(135deg, #f6f2ea, #ece6db);
    border-radius: 60px;
    padding: 60px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.05);
}

.complete-card {
    background: white;
    border-radius: 35px;
    padding: 60px 40px;
    border: 1px solid rgba(200,169,81,0.25);
    box-shadow: 0 25px 50px rgba(0,0,0,0.06);
    text-align: center;
}

.complete-icon {
    width: 110px;
    height: 110px;
    background: rgba(200,169,81,0.12);
    color: var(--accent-color);

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 45px;

    margin: auto auto 30px;
}

.complete-title {
    font-size: 2.3rem;
    font-weight: 700;
    margin-bottom: 20px;
}

.complete-text {
    color: var(--soft-color);
    line-height: 2;
    font-size: 1.05rem;
    margin-bottom: 35px;
}

.btn-login {
    background-color: var(--accent-color);
    color: white;
    border-radius: 35px;
    padding: 14px 35px;
    border: none;
    transition: 0.3s ease;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
}

.btn-login:hover {
    background-color: #b8953f;
    transform: translateY(-4px);
    color: white;
}

@media (max-width:768px){

    .complete-wrapper{
        padding:25px;
        border-radius:30px;
    }

    .complete-card{
        padding:40px 20px;
    }

    .complete-title{
        font-size:1.8rem;
    }

}

</style>
{% endblock %}

{% block content %}

<section class="complete-section">

    <div class="container">

        <div class="complete-wrapper">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="complete-card">

                        <div class="complete-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>

                        <h2 class="complete-title">
                            تم تغيير كلمة المرور
                        </h2>

                        <p class="complete-text">

                            تم تحديث كلمة المرور الخاصة بحسابك بنجاح،
                            يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.

                        </p>

                        <a href="{% url 'accounts:login' %}"
                           class="btn-login">

                            تسجيل الدخول

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
