{% extends "base.html" %}

{% block title %}
تم إرسال الرابط - وصل
{% endblock %}

{% block extra_css %}
<style>

.done-section {
    padding: 30px 0 100px;
}

.done-wrapper {
    background: linear-gradient(135deg, #f6f2ea, #ece6db);
    border-radius: 60px;
    padding: 60px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.05);
}

.done-card {
    background: white;
    border-radius: 35px;
    padding: 60px 40px;
    border: 1px solid rgba(200,169,81,0.25);
    box-shadow: 0 25px 50px rgba(0,0,0,0.06);
    text-align: center;
}

.done-icon {
    width: 110px;
    height: 110px;
    background: rgba(200,169,81,0.12);
    color: var(--accent-color);

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 45px;

    margin: auto auto 30px;
}

.done-title {
    font-size: 2.3rem;
    font-weight: 700;
    margin-bottom: 20px;
}

.done-text {
    color: var(--soft-color);
    line-height: 2;
    font-size: 1.05rem;
}

.back-link {
    margin-top: 35px;
}

.back-link a {
    color: var(--accent-color);
    text-decoration: none;
    font-weight: 600;
}

.back-link a:hover {
    text-decoration: underline;
}

@media (max-width:768px){

    .done-wrapper{
        padding:25px;
        border-radius:30px;
    }

    .done-card{
        padding:40px 20px;
    }

    .done-title{
        font-size:1.8rem;
    }

}

</style>
{% endblock %}

{% block content %}

<section class="done-section">

    <div class="container">

        <div class="done-wrapper">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="done-card">

                        <div class="done-icon">
                            <i class="bi bi-envelope-check"></i>
                        </div>

                        <h2 class="done-title">
                            تم إرسال الرابط
                        </h2>

                        <p class="done-text">

                            إذا كان البريد الإلكتروني موجودًا في النظام،
                            فستصلك رسالة تحتوي على رابط
                            لإعادة تعيين كلمة المرور.

                        </p>

                        <div class="back-link">

                            <a href="{% url 'accounts:login' %}">
                                العودة لتسجيل الدخول
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
