{% extends "base.html" %}

{% block extra_css %}

<style>
.driver-layout {
    display: flex;
    gap: 35px;
}

.driver-sidebar {
    width: 270px;
    background: white;
    border-radius: 40px;
    padding: 30px 20px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.05);
    height: fit-content;
}

.driver-page-bg {
    background: linear-gradient(135deg, #f6f2ea, #ebe3d6);
    padding: 50px;
    border-radius: 45px;
}

@media (max-width: 768px) {
    .driver-page-bg {
        padding: 20px;
        border-radius: 25px;
    }
}

.driver-profile-box {
    text-align: center;
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    margin-bottom: 25px;
}

.driver-avatar {
    width: 85px;
    height: 85px;
    background: linear-gradient(135deg, var(--accent-color), #d4af37);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    color: white;
    font-size: 30px;
}

.driver-status {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    padding: 4px 14px;
    border-radius: 20px;
    background-color: rgba(200, 169, 81, 0.15);
    color: var(--accent-color);
}

.driver-link {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    border-radius: 22px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--dark-color);
    font-weight: 500;
    transition: 0.3s ease;
    position: relative;
}

.driver-link:hover {
    background-color: rgba(200, 169, 81, 0.15);
    color: var(--accent-color);
    transform: translateX(-6px);
}

.driver-link.active {
    background-color: rgba(200, 169, 81, 0.2);
    color: var(--accent-color);
}

.driver-link.active::before {
    content: "";
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 4px;
    background-color: var(--accent-color);
    border-radius: 5px;
}

.driver-content {
    flex: 1;
}

.sidebar-toggle-btn {
    display: none;
    margin-bottom: 20px;
}

@media (max-width: 991px) {
    .driver-layout {
        flex-direction: column;
    }

    .driver-sidebar {
        display: none;
    }

    .sidebar-toggle-btn {
        display: inline-block;
    }
}

.driver-offcanvas {
    background-color: var(--light-bg);
    border-left: 3px solid var(--accent-color);
}

.driver-offcanvas .offcanvas-body {
    padding: 25px;
}
</style>

{% endblock %}

{% block content %}

<button class="btn btn-accent sidebar-toggle-btn" data-bs-toggle="offcanvas" data-bs-target="#adminSidebarMobile">
    <i class="bi bi-speedometer2 me-2"></i>
    لوحة الإدارة
</button>

<div class="driver-page-bg">
    <div class="driver-layout">

    <!-- ===== Desktop Sidebar ===== -->
    <div class="driver-sidebar d-none d-lg-block">

        <div class="driver-profile-box">
            <div class="driver-avatar">
                <i class="bi bi-person-fill"></i>
            </div>

            <h6 class="mt-3 mb-1">{{ user.full_name }}</h6>
            <span class="driver-status">Admin</span>
        </div>

        <!-- Dashboard -->
        <a href="{% url 'admin_panel:dashboard' %}"
           class="driver-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2 me-2"></i>
            الرئيسية
        </a>

        <!-- Users -->
        <a href="{% url 'admin_panel:users' %}"
           class="driver-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-people me-2"></i>
            المستخدمين
        </a>

        <!-- Requests -->
        <a href="{% url 'admin_panel:requests' %}"
           class="driver-link {% if 'request' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-clipboard-check me-2"></i>
            الطلبات
        </a>

        <!-- Payments -->
        <a href="{% url 'admin_panel:payments' %}"
           class="driver-link {% if 'payment' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-cash-stack me-2"></i>
            المدفوعات
        </a>

        <!-- Notifications -->
        <a href="{% url 'admin_panel:notifications' %}"
           class="driver-link {% if 'notification' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-bell me-2"></i>
            الإشعارات
        </a>

    </div>

    <!-- ===== Content ===== -->
    <div class="driver-content">
        {% block admin_content %}{% endblock %}
    </div>

</div>
</div>

<!-- ===== Mobile Sidebar ===== -->
<div class="offcanvas offcanvas-start driver-offcanvas" tabindex="-1" id="adminSidebarMobile">

    <div class="offcanvas-header border-0">
        <h5 class="fw-bold">لوحة الإدارة</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">

        <a href="{% url 'admin_panel:dashboard' %}"
           class="driver-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            الرئيسية
        </a>

        <a href="{% url 'admin_panel:users' %}"
           class="driver-link {% if 'user' in request.resolver_match.url_name %}active{% endif %}">
            المستخدمين
        </a>

        <a href="{% url 'admin_panel:requests' %}"
           class="driver-link {% if 'request' in request.resolver_match.url_name %}active{% endif %}">
            الطلبات
        </a>

        <a href="{% url 'admin_panel:payments' %}"
           class="driver-link {% if 'payment' in request.resolver_match.url_name %}active{% endif %}">
            المدفوعات
        </a>

        <a href="{% url 'admin_panel:notifications' %}"
           class="driver-link {% if 'notification' in request.resolver_match.url_name %}active{% endif %}">
            الإشعارات
        </a>

    </div>

</div>

{% endblock %}
