{% extends "base.html" %}

{% block extra_css %}

<style>
/* ===== Layout Wrapper ===== */
.driver-layout {
    display: flex;
    gap: 35px;
}

/* ===== Sidebar ===== */
.driver-sidebar {
    width: 270px;
    background: white;
    border-radius: 40px;
    padding: 30px 20px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.05);
    height: fit-content;
}

/* ===== Dashboard Background Layer ===== */
.driver-page-bg {
    background: linear-gradient(135deg, #f6f2ea, #ebe3d6);
    padding: 50px;
    border-radius: 45px;
}

/* Mobile Fix */
@media (max-width: 768px) {
    .driver-page-bg {
        padding: 20px;
        border-radius: 25px;
    }
}

/* ===== Profile Box ===== */
.driver-profile-box {
    text-align: center;
    padding-bottom: 25px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    margin-bottom: 25px;
}

.driver-avatar {
    width: 85px;
    height: 85px;
    background: linear-gradient(135deg, var(--accent-color), #d4af37);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    color: white;
    font-size: 30px;
    box-shadow: 0 15px 35px rgba(200, 169, 81, 0.35);
}

.driver-status {
    display: inline-block;
    margin-top: 10px;
    font-size: 13px;
    padding: 4px 14px;
    border-radius: 20px;
    background-color: rgba(200, 169, 81, 0.15);
    color: var(--accent-color);
}

/* ===== Links ===== */
.driver-link {
    display: flex;
    align-items: center;
    padding: 12px 18px;
    border-radius: 22px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--dark-color);
    font-weight: 500;
    transition: 0.3s ease;
    position: relative;
}

.driver-link:hover {
    background-color: rgba(200, 169, 81, 0.15);
    color: var(--accent-color);
    transform: translateX(-6px);
}

/* Active */
.driver-link.active {
    background-color: rgba(200, 169, 81, 0.2);
    color: var(--accent-color);
}

.driver-link.active::before {
    content: "";
    position: absolute;
    right: 0;
    top: 20%;
    height: 60%;
    width: 4px;
    background-color: var(--accent-color);
    border-radius: 5px;
}

/* ===== Content Area ===== */
.driver-content {
    flex: 1;
}

/* ===== Mobile ===== */
.sidebar-toggle-btn {
    display: none;
    margin-bottom: 20px;
}

@media (max-width: 991px) {
    .driver-layout {
        flex-direction: column;
    }

    .driver-sidebar {
        display: none;
    }

    .sidebar-toggle-btn {
        display: inline-block;
    }
}

/* ===== Offcanvas ===== */
.driver-offcanvas {
    background-color: var(--light-bg);
    border-left: 3px solid var(--accent-color);
}

.driver-offcanvas .offcanvas-body {
    padding: 25px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% endblock %}

{% block content %}

<!-- Mobile Toggle -->

<button class="btn btn-accent sidebar-toggle-btn" data-bs-toggle="offcanvas" data-bs-target="#adminSidebarMobile">
    <i class="bi bi-speedometer2 me-2"></i>
    لوحة الإدارة
</button>

<div class="driver-page-bg">
    <div class="driver-layout">


    <!-- Sidebar -->
    <div class="driver-sidebar d-none d-lg-block">

        <div class="driver-profile-box">
            <div class="driver-avatar">
                <i class="bi bi-person-fill"></i>
            </div>

            <h6 class="mt-3 mb-1">{{ user.full_name }}</h6>

        </div>

        <a href="{% url 'admin_panel:dashboard' %}" class="driver-link">

            الرئيسية
        </a>

        <a href="#" class="driver-link">
            <i class="bi bi-people me-2"></i>
            المستخدمين
        </a>

        <a href="#" class="driver-link">
            <i class="bi bi-truck me-2"></i>
            السائقين
        </a>

        <a href="{% url 'admin_panel:requests' %}" class="driver-link">

            الطلبات
        </a>

        <a href="#" class="driver-link">
            <i class="bi bi-cash-stack me-2"></i>

        </a>

        <a href="#" class="driver-link">

    <!-- Content -->
    <div class="driver-content">

</div>


</div>
